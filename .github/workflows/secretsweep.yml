name: SecretSweep AI — Secret Detection

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  secret-detection:
    runs-on: ubuntu-latest
    name: Scan for hardcoded secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SecretSweep AI
        run: |
          pip install -r requirements.txt
          # Download ONNX model if available
          # (skip if not in repo — use pattern-only mode)

      - name: Run SecretSweep AI scan
        id: scan
        run: |
          python -m scripts.secretsweep_cli scan \
            "${{ github.server_url }}/${{ github.repository }}" \
            --output-format json \
            --output-file scan_results.json
        continue-on-error: true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secretsweep-results
          path: scan_results.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('scan_results.json')) return;
            const results = JSON.parse(
              fs.readFileSync('scan_results.json', 'utf8'));
            const body = [
              '## 🔍 SecretSweep AI Results',
              '',
              `**Secrets found:** ${results.total_secrets_found}`,
              `**CRITICAL:** ${results.severity_summary?.critical || 0}`,
              `**HIGH:** ${results.severity_summary?.high || 0}`,
              `**MEDIUM:** ${results.severity_summary?.medium || 0}`,
              `**LOW:** ${results.severity_summary?.low || 0}`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if CRITICAL secrets found
        if: steps.scan.outcome == 'success'
        run: |
          python -c "
          import json, sys
          r = json.load(open('scan_results.json'))
          if r.get('severity_summary', {}).get('critical', 0) > 0:
            print('CRITICAL secrets found — failing build')
            sys.exit(1)
          print('No CRITICAL secrets found')
          "
